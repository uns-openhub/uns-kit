name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-assistant-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ts:version:check
      - run: pnpm --filter @uns-kit/assistant-workflow run verify

  verify-package-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ts:version:check
      - run: pnpm run ts:build
      - run: pnpm run ts:pack:check
      - run: pnpm exec vitest run tests/api-package-boundary.test.ts
      - run: pnpm exec vitest run tests/uns-cli-upgrade.test.ts tests/uns-cli-bundle-create.test.ts
      - run: pnpm exec vitest run tests/runtime/process-group-contract.test.ts tests/process-group-upgrade.test.ts tests/process-group-direct.test.ts tests/runtime/process-group-usage.test.ts
      - run: pnpm exec vitest run tests/runtime/configuration-group-contract.test.ts tests/runtime/configuration-group-inspection.test.ts tests/runtime/process-group-generation.test.ts tests/runtime/process-group-configured-upgrade.test.ts
      - run: pnpm exec vitest run tests/subscription-readiness.test.ts tests/mqtt-proxy-logging.test.ts tests/mqtt-worker.test.ts tests/uns-mqtt-proxy.test.ts tests/mqtt-publish-queue.test.ts tests/mqtt-output-state.test.ts tests/zod4-config-contract.test.ts tests/runtime/process-group-backup-contract.test.ts
      - name: Install local acceptance broker
        run: sudo apt-get update -qq && sudo apt-get install --yes mosquitto
      - name: Rehearse built MQTT output persistence on loopback
        run: node scripts/accept-mqtt-output.mjs
